name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install project dependencies
      - name: Install dependencies
        working-directory: model_training
        run: pip install -r requirements.txt

      # 5. Check Python syntax
      - name: Check Python files
        run: python -m compileall model_training

      - name: Check imports
        working-directory: model_training
        run: python -c "import cv2; import numpy; import dotenv; import ultralytics"

      - name: Run tests
        working-directory: model_training
        run: pytest tests
